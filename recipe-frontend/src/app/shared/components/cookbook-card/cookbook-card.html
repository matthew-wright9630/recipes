<section class="cookbook-card">
  <mat-card (click)="routeToCookbook()" align="center">
    <mat-card-content class="cookbook-card__content">
      <mat-card-title class="cookbook-card__title"
        >{{ cookbook.name }}</mat-card-title
      >
      <img
        [src]="imageUrl + cookbook.imageUrl + '-thumb.jpg'"
        [alt]="cookbook.name"
        class="cookbook-card__img"
      />
    </mat-card-content>
  </mat-card>
</section>

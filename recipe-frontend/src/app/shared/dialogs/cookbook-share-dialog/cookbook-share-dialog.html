<div class="cookbook-share">
  <div class="cookbook-share__header">
    <h2 mat-dialog-title>Manage Access</h2>
    <button mat-icon-button (click)="onClose()" class="cookbook-share__close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="cookbook-share__content">
    <div class="cookbook-share__private">
      <mat-form-field
        class="cookbook-share__search-container"
        appearance="outline"
      >
        <mat-label>Search by username</mat-label>

        <input
          matInput
          [formControl]="searchControl"
          placeholder="Search by username..."
          [matAutocomplete]="userAuto"
        />

        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <mat-autocomplete
        #userAuto="matAutocomplete"
        (optionSelected)="addUserId($event.option.value)"
      >
        @for (user of searchResults; track user.id) {
        <mat-option [value]="user">
          <div class="cookbook-share__user-option">
            <!-- <img [src]="user.avatarUrl" [alt]="user.username" /> -->

            <span>{{ user.username }}</span>
          </div>
        </mat-option>
        }
      </mat-autocomplete>

      <div class="cookbook-share__email-div" [formGroup]="form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email address</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>
        <button (click)="addEmail()" mat-stroked-button>Add</button>
      </div>
    </div>
    <table mat-table [dataSource]="shareRecipients">
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let recipient">
          {{ recipient.username ?? recipient.email }}
        </td>
      </ng-container>

      <ng-container matColumnDef="remove">
        <th mat-header-cell *matHeaderCellDef></th>

        <td mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="removeRecipient(user)">
            <mat-icon>close</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let user; columns: displayedColumns"></tr>
    </table>
  </div>
  <button mat-raised-button>Save Changes</button>
</div>

<div class="cookbook-share">
  <div class="cookbook-share__header">
    <h2 mat-dialog-title>Manage Access</h2>
    <button mat-icon-button (click)="onClose()" class="cookbook-share__close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="cookbook-share__content">
    <div class="cookbook-share__private">
      <mat-form-field
        class="cookbook-share__search-container"
        appearance="outline"
      >
        <mat-label>Search by username</mat-label>
        <input
          matInput
          [formControl]="searchControl"
          placeholder="Search by username..."
          class="cookbook-share__search"
        />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <div class="cookbook-share__email-div" [formGroup]="form">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email address</mat-label>
          <input matInput formControlName="email" />
        </mat-form-field>
        <button (click)="addUser()" mat-stroked-button>Add</button>
      </div>
    </div>
    <table mat-table [dataSource]="sharedUsers">
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <ng-container matColumnDef="access">
        <th mat-header-cell *matHeaderCellDef>Access</th>
        <td mat-cell *matCellDef="let user">
          @if (user.permission === 'OWNER') {
          <span>Owner</span>
          } @else {
          <mat-form-field appearance="outline">
            <mat-select [(value)]="user.permission">
              <mat-option value="READ">Reader</mat-option>
              <mat-option value="READ_WRITE">Editor</mat-option>
            </mat-select>
          </mat-form-field>
          }
        </td>
      </ng-container>

      <ng-container matColumnDef="remove">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="removeUser(user)">
            <mat-icon>close</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let user; columns: displayedColumns"></tr>
    </table>
  </div>
  <button mat-raised-button>Save Changes</button>
</div>

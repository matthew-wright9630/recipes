<div class="cookbook-share">
  <div class="cookbook-share__header">
    <h2 mat-dialog-title>Manage Access</h2>
    <button mat-icon-button (click)="onClose()" class="cookbook-share__close">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="cookbook-share__content">
    <table mat-table [dataSource]="sharedUsers">
      <!-- User -->
      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let user">{{ user.username }}</td>
      </ng-container>

      <!-- Access -->
      <ng-container matColumnDef="access">
        <th mat-header-cell *matHeaderCellDef>Access</th>
        <td mat-cell *matCellDef="let user">
          <mat-form-field appearance="outline">
            <mat-select
              [(value)]="user.permission"
              (selectionChange)="updateUserAccess(user)"
            >
              <mat-option value="READ">Reader</mat-option>
              <mat-option value="READ_WRITE">Editor</mat-option>
            </mat-select>
          </mat-form-field>
        </td>
      </ng-container>

      <!-- Remove -->
      <ng-container matColumnDef="remove">
        <th mat-header-cell *matHeaderCellDef>Remove User</th>
        <td mat-cell *matCellDef="let user">
          <mat-checkbox (change)="removeUser(user, $event.checked)">
          </mat-checkbox>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let user; columns: displayedColumns"></tr>
    </table>
  </div>
  <button mat-raised-button (click)="saveChanges()">Save Changes</button>
</div>
